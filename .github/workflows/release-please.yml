name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

env:
  # Pinned to the engine the maintainer builds against locally and to ci.yml.
  # Move all three together.
  GODOT_VERSION: 4.6.1-stable

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Parse Conventional Commits since the last tag. Bumps MODLOADER_VERSION
      # in src/constants.gd (the only source file release-please edits), updates
      # CHANGELOG.md and the manifest. When the resulting PR merges, release-please
      # creates the tag + GitHub Release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only run the build + asset upload when a release was just created.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      # Concatenate src/*.gd into modloader.gd. This is the artifact users
      # install; the repo editing surface is the src/ tree.
      - name: Build modloader.gd from src/
        if: ${{ steps.release.outputs.release_created }}
        run: |
          chmod +x build.sh
          ./build.sh

      # Put the exact bytes we are about to publish in front of a real GDScript
      # compiler. ci.yml already gates every PR, but this artifact is BUILT
      # HERE, so it is not the file any PR checked -- release-please rewrites
      # MODLOADER_VERSION in src/constants.gd on the way in, and nothing had
      # ever compiled the result. Users install this file into an autoload; a
      # parse error in it means their game does not start.
      - name: Set up Godot
        if: ${{ steps.release.outputs.release_created }}
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Parse-check the artifact being released
        if: ${{ steps.release.outputs.release_created }}
        env:
          GODOT: /home/runner/godot/godot
        run: |
          chmod +x check.sh check_*.sh
          ./check.sh

      # Attach the freshly built modloader.gd + the repo's override.cfg to
      # the release, plus the installer scripts so users can grab them from
      # /releases/latest/download/<file> the same way the installers
      # themselves fetch modloader.gd / override.cfg.
      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            modloader.gd \
            override.cfg \
            windows-installer.bat \
            linux-installer.sh \
            --clobber

      # Publish only once the assets are attached and checked.
      #
      # release-please creates the Release as a draft (see
      # release-please-config.json). Published-first was a live trap: from the
      # moment a release exists, /releases/latest/download/modloader.gd resolves
      # to it -- and both installers fetch exactly that URL. A build or upload
      # failure therefore left every new install hard-failing on a 404, with no
      # way to self-heal until someone noticed.
      - name: Publish the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false